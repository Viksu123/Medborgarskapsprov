  { q: { fi: 'Kuinka monta kansanedustajaa eduskunnassa on?', sv: 'Hur många ledamöter har riksdagen?', ru: 'Сколько депутатов в парламенте Финляндии (эдускунте)?', ar: 'كم عدد النواب في البرلمان الفنلندي؟' }, o: ['101', '151', '200', '349'], a: 2 },
  { q: { fi: 'Minä vuonna Suomi itsenäistyi?', sv: 'Vilket år blev Finland självständigt?', ru: 'В каком году Финляндия стала независимой?', ar: 'في أي عام استقلت فنلندا؟' }, o: ['1809', '1917', '1939', '1952'], a: 1 },
  { q: { fi: 'Mihin numeroon soitat hengenvaarassa?', sv: 'Vilket nummer ringer du vid akut livsfara?', ru: 'Какой номер набрать при угрозе жизни?', ar: 'أي رقم تتصل به عند الخطر على الحياة؟' }, o: ['1177', '112', '911', '999'], a: 1 },
  { q: { fi: 'Minä vuonna Suomi liittyi EU:hun?', sv: 'Vilket år gick Finland med i EU?', ru: 'В каком году Финляндия вступила в ЕС?', ar: 'في أي عام انضمت فنلندا إلى الاتحاد الأوروبي؟' }, o: ['1973', '1986', '1995', '2004'], a: 2 },
  { q: { fi: 'Kuinka monta vuotta presidentin toimikausi kestää?', sv: 'Hur många år varar presidentens mandatperiod?', ru: 'Сколько лет длится срок полномочий президента?', ar: 'كم سنة تدوم ولاية رئيس الجمهورية؟' }, o: ['4', '5', '6', '7'], a: 2 },
  { q: { fi: 'Minä vuonna naiset saivat äänioikeuden ja vaalikelpoisuuden?', sv: 'Vilket år fick kvinnor rösträtt och rätt att kandidera?', ru: 'В каком году женщины получили право голосовать и избираться?', ar: 'في أي عام حصلت النساء على حق التصويت والترشح؟' }, o: ['1866', '1906', '1921', '1945'], a: 1 },
  { q: { fi: 'Milloin talvisota käytiin?', sv: 'När utkämpades vinterkriget?', ru: 'Когда шла Зимняя война?', ar: 'متى دارت حرب الشتاء؟' }, o: ['1914–1918', '1939–1940', '1941–1944', '1945–1948'], a: 1 },

  { q: { fi: 'Minä vuonna nykyinen perustuslaki tuli voimaan?', sv: 'Vilket år trädde den nuvarande grundlagen i kraft?', ru: 'В каком году вступила в силу действующая конституция?', ar: 'في أي عام دخل الدستور الحالي حيز التنفيذ؟' }, o: ['1919', '1995', '2000', '2012'], a: 2 },
  { q: { fi: 'Mitkä ovat Suomen kansalliskielet?', sv: 'Vilka är Finlands nationalspråk?', ru: 'Какие языки являются национальными в Финляндии?', ar: 'ما هي اللغات الوطنية في فنلندا؟' },
    o: { fi: ['Suomi ja englanti', 'Suomi ja ruotsi', 'Suomi ja saame', 'Vain suomi'], sv: ['Finska och engelska', 'Finska och svenska', 'Finska och samiska', 'Bara finska'], ru: ['Финский и английский', 'Финский и шведский', 'Финский и саамский', 'Только финский'], ar: ['الفنلندية والإنجليزية', 'الفنلندية والسويدية', 'الفنلندية والسامية', 'الفنلندية فقط'] }, a: 1 },
];

let lang = 'fi', qi = 0, pick = null, score = 0;
try { const s = localStorage.getItem('lang'); if (LANGS[s]) lang = s; } catch (e) {}

let dark = document.documentElement.classList.contains('dark');
const SUN = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const toggleTheme = () => { dark = !dark; try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {} render(); };
const setLang = (l) => { lang = l; qi = 0; pick = null; score = 0; try { localStorage.setItem('lang', l); } catch (e) {} render(); };
const answer = (k) => { if (pick !== null) return; pick = k; if (k === QS[qi].a) score++; render(); };
const next = () => { qi++; pick = null; render(); };
const again = () => { qi = 0; pick = null; score = 0; render(); };

const sec = (h, body) => `<section class="rounded-2xl bg-white p-6 ring-1 ring-ink/10 ${SH}"><h2 class="mb-3 flex items-center gap-3 font-serif text-2xl font-bold"><span class="h-1 w-6 shrink-0 rounded bg-gold"></span>${h}</h2>${body}</section>`;
const BTN = 'rounded-xl bg-brand px-5 py-3 font-semibold text-white hover:bg-[#003f8a] focus:outline-none focus-visible:ring-2 focus-visible:ring-gold';

function quiz(l) {
  const t = l.quiz, n = QS.length;
  if (qi >= n) {
    return `<div class="text-center"><p class="text-sm text-ink/60">${t[7]}</p><p class="my-2 font-serif text-6xl font-bold text-brand">${score} <span class="text-3xl text-ink/40">${t[2]} ${n}</span></p><button onclick="again()" class="${BTN} mt-4">${t[8]}</button></div>`;
  }
  const q = QS[qi], opts = Array.isArray(q.o) ? q.o : q.o[lang], done = pick !== null;
  const btns = opts.map((o, k) => {
    let c = 'border-ink/15 bg-white hover:border-brand';
    if (done) c = k === q.a ? 'border-emerald-600 bg-emerald-50 text-emerald-900' : k === pick ? 'border-rose-600 bg-rose-50 text-rose-900' : 'border-ink/10 bg-white opacity-50';
    return `<button onclick="answer(${k})" ${done ? 'disabled' : ''} class="w-full rounded-xl border-2 p-3.5 text-start transition ${c}">${o}</button>`;
  }).join('');
  return `<p class="mb-2 text-sm font-semibold text-ink/60">${t[1]} ${qi + 1} ${t[2]} ${n}</p>
    <div class="mb-4 h-1.5 overflow-hidden rounded-full bg-mist"><div class="h-full bg-brand transition-all" style="width:${((qi + (done ? 1 : 0)) / n) * 100}%"></div></div>
    <h3 class="mb-4 text-lg font-semibold">${q.q[lang]}</h3><div class="space-y-2.5">${btns}</div>
    ${done ? `<p class="mt-4 font-semibold ${pick === q.a ? 'text-emerald-700' : 'text-rose-700'}">${pick === q.a ? t[3] : t[4]}</p><button onclick="next()" class="${BTN} mt-3 w-full sm:w-auto">${qi + 1 < n ? t[5] : t[6]}</button>` : ''}`;
}

const price = (l) => { const p = l.price; return `<section class="rounded-2xl border-t-4 border-gold bg-white p-6 ring-1 ring-ink/10 ${SH}"><p class="text-xs font-semibold uppercase tracking-wide text-brand">${l.soon}</p><h2 class="mt-1 font-serif text-2xl font-bold">${p[0]}</h2><p class="mt-3 flex items-baseline gap-2"><span class="font-serif text-5xl font-bold text-brand">${p[1]}</span><span class="text-sm text-ink/60">${p[2]}</span></p><p class="mt-3">${p[3]}</p><button disabled class="mt-4 w-full cursor-not-allowed rounded-xl bg-mist px-5 py-3 font-semibold text-ink/60">${p[4]}</button><p class="mt-3 text-xs text-ink/60">${p[5]}</p></section>`; };

function render() {
  const l = LANGS[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = l.dir;
  document.documentElement.classList.toggle('dark', dark);
  const th = document.getElementById('th');
  th.innerHTML = dark ? SUN : MOON; th.setAttribute('aria-label', l.theme);
  document.getElementById('ban').textContent = l.ban;
  document.getElementById('logo').innerHTML = LOGO;
  document.getElementById('fav').href = 'data:image/svg+xml,' + encodeURIComponent(LOGO);
  document.getElementById('tag').textContent = l.tag;
  document.getElementById('foot').textContent = l.foot;
  document.getElementById('sw').innerHTML = Object.keys(LANGS).map((k) =>
    `<button onclick="setLang('${k}')" aria-pressed="${k === lang}" class="rounded-full px-3 py-1.5 ${k === lang ? 'bg-brand text-white' : 'text-ink/70 hover:text-brand'}">${LANGS[k].code}</button>`).join('');

  const days = Math.max(0, Math.ceil((new Date(TEST_START) - new Date()) / 864e5));
  const vals = [l.facts[0][1], l.facts[1][1], OFFICIAL.pass ?? l.facts[2][1], OFFICIAL.fee ?? l.facts[3][1]];
  const tiles = l.facts.map((f, k) => `<div class="rounded-xl bg-white p-4 ring-1 ring-ink/10 border-s-4 border-gold ${SH}"><p class="text-xs font-semibold uppercase tracking-wide text-ink/55">${f[0]}</p><p class="mt-1 font-semibold ${k > 1 && !(k === 2 ? OFFICIAL.pass : OFFICIAL.fee) ? 'text-ink/60' : ''}">${vals[k]}</p></div>`).join('');
  const steps = l.when[1].map(([d, t]) => `<li class="relative"><span class="absolute -start-[1.65rem] top-1.5 h-3 w-3 rounded-full bg-brand ring-4 ring-white"></span><p class="font-semibold text-brand">${d}</p><p>${t}</p></li>`).join('');

  document.getElementById('app').innerHTML = `
    <section class="relative overflow-hidden rounded-3xl bg-brand p-7 text-white ring-1 ring-white/10 shadow-[0_24px_48px_-28px_rgba(0,82,180,0.7)] sm:p-10 lg:p-14">
      <div class="absolute inset-y-0 left-[16%] w-4 bg-white/10"></div><div class="absolute inset-x-0 top-[60%] h-4 bg-white/10"></div>
      <div class="relative grid items-end gap-8 lg:grid-cols-[1fr_auto]">
        <div>
          <span class="inline-flex items-center gap-2 rounded-full bg-gold px-4 py-1.5 text-sm font-bold uppercase tracking-wide text-ink"><span class="h-2 w-2 animate-pulse rounded-full bg-ink"></span>${l.soon}</span>
          <h1 class="mt-4 max-w-2xl font-serif text-3xl font-bold leading-tight sm:text-5xl lg:text-6xl">${l.h1}</h1>
          <p class="mt-4 max-w-xl text-white/85">${l.lead}</p>
        </div>
        <div class="flex items-center gap-4 rounded-2xl bg-white/10 px-5 py-4 ring-1 ring-white/15 lg:max-w-[15rem] lg:flex-col lg:items-start lg:gap-1"><span class="font-serif text-6xl font-bold leading-none text-gold">${days}</span><span class="text-sm text-white/80">${l.count}</span></div>
      </div>
    </section>
    <div><div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">${tiles}</div><p class="mt-3 text-sm text-ink/70">${l.note}</p></div>
    <div class="grid gap-6 lg:grid-cols-[1fr_26rem] lg:items-start">
      <div class="space-y-6">
        ${sec(l.what[0], `<p>${l.what[1]}</p><p class="mt-4 border-s-4 border-gold bg-mist p-3 text-sm font-semibold">${l.only}</p>`)}
        ${sec(l.topics[0], `<ul class="flex flex-wrap gap-2">${l.topics[1].map((x) => `<li class="rounded-full bg-mist px-3 py-1.5 text-sm font-medium text-brand">${x}</li>`).join('')}</ul><p class="mt-3 text-sm text-ink/70">${l.topics[2]}</p>`)}
        ${sec(l.who[0], `<p>${l.who[1]}</p>`)}
        ${sec(l.when[0], `<ol class="space-y-5 border-s-2 border-brand/20 ps-5">${steps}</ol>`)}
      </div>
      <aside class="space-y-6">${price(l)}${sec(l.quiz[0], quiz(l))}</aside>
    </div>`;
  if (window.ccRefresh) ccRefresh();
}
render();
</script>
<script>
// ===== Google Analytics 4 + cookie-samtycke (GDPR / ePrivacy) =====
const GA_ID = 'G-360H1BB2QF'; // (i Next.js: process.env.NEXT_PUBLIC_GA_ID)
const CC_KEY = 'cc-v1';
const CC = {
  fi: { t: 'Evästeet', p: 'Käytämme Google Analyticsia (Google) sivuston käytön mittaamiseen vain suostumuksellasi. Ilman suostumusta analytiikkaevästeitä ei aseteta eikä tietoja lähetetä. Voit muuttaa valintaasi milloin tahansa sivun alareunasta.', y: 'Hyväksy kaikki', n: 'Hylkää', s: 'Evästeasetukset', l: 'Käytännöt' },

  en: { t: 'Cookies', p: 'We use Google Analytics (Google) to measure how the site is used, but only with your consent. Without consent no analytics cookies are set and no data is sent. You can change your choice at any time at the bottom of the page.', y: 'Accept all', n: 'Decline', s: 'Cookie settings', l: 'Policies' },
  ru: { t: 'Файлы cookie', p: 'Мы используем Google Analytics (Google), чтобы измерять использование сайта, но только с вашего согласия. Без согласия аналитические cookie не устанавливаются и данные не передаются. Изменить выбор можно в любой момент внизу страницы.', y: 'Принять все', n: 'Отклонить', s: 'Настройки cookie', l: 'Политики' },
  ar: { t: 'ملفات تعريف الارتباط', p: 'نستخدم Google Analytics (من Google) لقياس استخدام الموقع، ولكن بموافقتك فقط. بدون الموافقة لا تُضبط ملفات تعريف ارتباط تحليلية ولا تُرسل أي بيانات. يمكنك تغيير اختيارك في أي وقت من أسفل الصفحة.', y: 'قبول الكل', n: 'رفض', s: 'إعدادات ملفات تعريف الارتباط', l: 'السياسات' },
};
// Språk: sidans valda språk, annars webbläsarens (fi/sv/ru/ar), annars engelska
function ccLang() {
  let s = null; try { s = localStorage.getItem('lang'); } catch (e) {}
  if (s && CC[s]) return s;
  const b = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return CC[b] ? b : 'en';
}
const ccGet = () => { try { const c = JSON.parse(localStorage.getItem(CC_KEY)); return c && typeof c.analytics === 'boolean' ? c : null; } catch (e) { return null; } };
const ccSave = (a) => { try { localStorage.setItem(CC_KEY, JSON.stringify({ analytics: a, ts: Date.now() })); } catch (e) {} };

function loadGA() {
  window['ga-disable-' + GA_ID] = false;
  gtag('consent', 'update', { analytics_storage: 'granted' });
  if (window.__gaLoaded) return;
  window.__gaLoaded = true;
  gtag('js', new Date());
  gtag('config', GA_ID, { allow_google_signals: false, allow_ad_personalization_signals: false });
  const sc = document.createElement('script');
  sc.async = true; sc.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(GA_ID);
  document.head.appendChild(sc);
}
function stopGA() {
  window['ga-disable-' + GA_ID] = true;
  gtag('consent', 'update', { analytics_storage: 'denied' });
  const names = document.cookie.split(';').map((c) => c.split('=')[0].trim()).filter((n) => n === '_ga' || n === '_gid' || n.startsWith('_ga_'));
  const parts = location.hostname.split('.'), domains = [''];
  for (let i = 0; i < parts.length - 1; i++) domains.push('.' + parts.slice(i).join('.'));
  domains.push(location.hostname);
  names.forEach((n) => domains.forEach((d) => { document.cookie = n + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/' + (d ? '; domain=' + d : ''); }));
}

function ccRefresh() {
  const t = CC[ccLang()], el = document.getElementById('cc');
  if (el) {
    el.dir = ccLang() === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('cc-t').textContent = t.t; document.getElementById('cc-p').textContent = t.p;
    document.getElementById('cc-n').textContent = t.n; document.getElementById('cc-y').textContent = t.y; document.getElementById('cc-l').textContent = t.l;
  }
  const b = document.getElementById('cc-set'); if (b) b.textContent = t.s;
  const pl = document.getElementById('pol'); if (pl) pl.textContent = t.l;
}
function ccOpen() { document.getElementById('cc').hidden = false; ccRefresh(); document.getElementById('cc-n').focus(); }
function ccChoose(a) { ccSave(a); a ? loadGA() : stopGA(); document.getElementById('cc').hidden = true; }

(function () {
  const el = document.createElement('div');
  el.id = 'cc'; el.hidden = true; el.setAttribute('role', 'dialog'); el.setAttribute('aria-labelledby', 'cc-t');
  el.className = 'fixed inset-x-3 bottom-3 z-50 rounded-2xl border-t-4 border-gold bg-white p-5 ring-1 ring-ink/10 shadow-[0_20px_50px_-12px_rgba(14,27,51,0.35)] sm:inset-x-auto sm:start-6 sm:bottom-6 sm:max-w-md';
  el.innerHTML = '<h2 id="cc-t" class="font-serif text-lg font-bold"></h2><p id="cc-p" class="mt-2 text-sm text-ink/70"></p><a id="cc-l" href="/policyer" class="mt-2 inline-block text-sm font-semibold text-brand underline"></a>' +
    '<div class="mt-4 grid grid-cols-2 gap-3">' +
    '<button id="cc-n" onclick="ccChoose(false)" class="rounded-xl border-2 border-brand px-4 py-2.5 text-sm font-semibold text-brand hover:opacity-80"></button>' +
    '<button id="cc-y" onclick="ccChoose(true)" class="rounded-xl border-2 border-brand bg-brand px-4 py-2.5 text-sm font-semibold text-white hover:opacity-90"></button></div>';
  document.body.appendChild(el);
  const c = ccGet();
  if (c && c.analytics) loadGA();
  if (!c || location.hash === '#cookies') el.hidden = false;
  ccRefresh();
})();
</script>
